<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Parts Game</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: #ff6f61;
            text-shadow: 2px 2px #fff;
        }

        .game-container {
            display: flex;
            gap: 20px;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 1000px;
            width: 100%;
        }

        .sidebar {
            flex: 1;
            background: #ffe4e1;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar h2 {
            text-align: center;
            color: #d35400;
        }

        .draggable {
            background: #fff;
            padding: 10px 15px;
            border: 2px solid #ffb6c1;
            border-radius: 8px;
            cursor: grab;
            text-align: center;
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            transition: transform 0.2s, background 0.2s;
            user-select: none;
        }

        .draggable:hover {
            background: #fff0f5;
            transform: scale(1.05);
        }

        .draggable:active {
            cursor: grabbing;
        }

        .draggable.dragging {
            opacity: 0.5;
        }

        .draggable.matched {
            background-color: #90ee90;
            border-color: #2e8b57;
            cursor: default;
            color: #006400;
            text-decoration: line-through; /* Optional: strike through in list */
            opacity: 0.6;
            pointer-events: none; /* Disable dragging */
        }

        .diagram-area {
            position: relative;
            width: 626px;
            height: 679px;
            border: 2px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            background-color: #fff;
        }

        .diagram-area img {
            width: 100%;
            height: 100%;
            display: block;
        }

        .drop-zone {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border: 2px dashed #bbb;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #555;
            transition: background 0.3s, border 0.3s;
            z-index: 10;
            /* Default size for labels */
            width: 120px;
            height: 40px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .drop-zone.hover {
            background: #e6e6fa;
            border-color: #9370db;
            transform: scale(1.05);
        }

        .drop-zone.correct {
            background: #98fb98;
            border: 2px solid #228b22;
            color: #006400;
        }

        .drop-zone.incorrect {
            animation: shake 0.5s;
            border-color: #ff6347;
            background: #ffe4e1;
        }

        /* Positions adjusted to align with background image labels */
        /* Left Side */
        .zone-eye { top: 40px; left: 140px; }
        .zone-nose { top: 200px; left: 140px; }
        .zone-mouth { top: 330px; left: 140px; }
        .zone-arm { top: 500px; left: 140px; }
        .zone-leg { top: 640px; left: 140px; }

        /* Right Labels */
        .zone-head { top: 80px; right: 40px; } /* Aligned with "Hair" label */
        .zone-ear { top: 210px; right: 40px; }
        .zone-hand { top: 540px; right: 40px; }
        .zone-foot { top: 640px; right: 40px; } /* No label, placing symmetrically */

        /* Extra parts */
        .zone-neck { top: 360px; left: 270px; width: 80px; height: 30px; }
        .zone-heart { top: 450px; left: 270px; width: 80px; height: 80px; border-radius: 50%; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .feedback-area {
            margin-top: 20px;
            font-size: 1.5em;
            font-weight: bold;
            height: 30px;
            color: #333;
        }

        .score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 1.2em;
        }

    </style>
</head>
<body>

    <h1>🧍 Body Parts Game</h1>

    <div class="score-board">Score: <span id="score">0</span></div>

    <div class="game-container">
        <div class="sidebar" id="label-bank">
            <h2>Parts</h2>
            <!-- Draggable Items -->
            <div class="draggable" draggable="true" data-part="head">Head</div>
            <div class="draggable" draggable="true" data-part="eye">Eyes</div>
            <div class="draggable" draggable="true" data-part="ear">Ears</div>
            <div class="draggable" draggable="true" data-part="nose">Nose</div>
            <div class="draggable" draggable="true" data-part="mouth">Mouth</div>
            <div class="draggable" draggable="true" data-part="neck">Neck</div>
            <div class="draggable" draggable="true" data-part="arm">Arms</div>
            <div class="draggable" draggable="true" data-part="hand">Hands</div>
            <div class="draggable" draggable="true" data-part="leg">Legs</div>
            <div class="draggable" draggable="true" data-part="foot">Feet</div>
            <div class="draggable" draggable="true" data-part="heart">Heart</div>
        </div>

        <div class="diagram-area">
            <img src="image.png" alt="Body Diagram">

            <!-- Drop Zones -->
            <!-- We use data-part to match the draggable -->
            <!-- Mapping "Head" to the "Hair" label position -->
            <div class="drop-zone zone-head" data-part="head"></div>

            <div class="drop-zone zone-eye" data-part="eye"></div>
            <div class="drop-zone zone-ear" data-part="ear"></div>
            <div class="drop-zone zone-nose" data-part="nose"></div>
            <div class="drop-zone zone-mouth" data-part="mouth"></div>
            <div class="drop-zone zone-neck" data-part="neck"></div>
            <div class="drop-zone zone-arm" data-part="arm"></div>
            <div class="drop-zone zone-hand" data-part="hand"></div>
            <div class="drop-zone zone-leg" data-part="leg"></div>
            <div class="drop-zone zone-foot" data-part="foot"></div>
            <div class="drop-zone zone-heart" data-part="heart"></div>
        </div>
    </div>

    <div class="feedback-area" id="feedback"></div>

<script>
    const draggables = document.querySelectorAll('.draggable');
    const dropZones = document.querySelectorAll('.drop-zone');
    const scoreDisplay = document.getElementById('score');
    const feedbackDisplay = document.getElementById('feedback');

    let score = 0;
    const totalParts = dropZones.length;

    // --- Drag Events ---
    draggables.forEach(draggable => {
        draggable.addEventListener('dragstart', (e) => {
            if(draggable.classList.contains('matched')) {
                e.preventDefault();
                return;
            }
            draggable.classList.add('dragging');
            e.dataTransfer.setData('text/plain', draggable.dataset.part);
            e.dataTransfer.setData('text/label', draggable.textContent); // Store label to display in box
        });

        draggable.addEventListener('dragend', () => {
            draggable.classList.remove('dragging');
        });
    });

    // --- Drop Zone Events ---
    dropZones.forEach(zone => {
        zone.addEventListener('dragover', (e) => {
            e.preventDefault(); // Allow drop
            if(!zone.classList.contains('correct')) {
                zone.classList.add('hover');
            }
        });

        zone.addEventListener('dragleave', () => {
            zone.classList.remove('hover');
        });

        zone.addEventListener('drop', (e) => {
            e.preventDefault();
            zone.classList.remove('hover');

            if(zone.classList.contains('correct')) return; // Already filled

            const partId = e.dataTransfer.getData('text/plain');
            const partLabel = e.dataTransfer.getData('text/label');

            const targetPart = zone.dataset.part;

            if (partId === targetPart) {
                // Correct Match
                handleCorrect(zone, partId, partLabel);
            } else {
                // Incorrect Match
                handleIncorrect(zone);
            }
        });
    });

    function handleCorrect(zone, partId, label) {
        zone.classList.add('correct');
        zone.textContent = label;

        // Find the draggable and mark it matched
        const draggable = document.querySelector(`.draggable[data-part="${partId}"]`);
        if(draggable) draggable.classList.add('matched');

        score++;
        scoreDisplay.textContent = score;

        feedbackDisplay.textContent = "Great Job! That's the " + label + "! 🎉";
        feedbackDisplay.style.color = "green";

        if(score === totalParts) {
            feedbackDisplay.textContent = "Congratulations! You found all the body parts! 🏆";
            // Optional: Celebration effect
        }
    }

    function handleIncorrect(zone) {
        zone.classList.add('incorrect');
        feedbackDisplay.textContent = "Oops! Try again. 🤔";
        feedbackDisplay.style.color = "red";

        // Remove shake class after animation
        setTimeout(() => {
            zone.classList.remove('incorrect');
        }, 500);
    }
</script>
</body>
</html>
