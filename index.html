<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growing Plants Gizmo Clone</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background-color: #f0f4c3; color: #333; }

        /* Layout */
        .main-grid { display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
        .visual-area { background: white; border-radius: 12px; padding: 20px; display: flex; justify-content: space-around; align-items: flex-end; height: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); position: relative; }
        .controls-area { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .data-area { grid-column: 1 / -1; background: white; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

        /* Pot/Plant Visuals */
        .pot-container { width: 30%; position: relative; text-align: center; }
        .pot { width: 100px; height: 80px; background: #795548; margin: 0 auto; clip-path: polygon(10% 0, 90% 0, 80% 100%, 20% 100%); position: relative; z-index: 2; }
        .soil-surface { width: 80px; height: 10px; background: #5d4037; margin: 0 auto; margin-bottom: -5px; position: relative; z-index: 1; }
        .plant-stem { width: 8px; background: #4caf50; margin: 0 auto; position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); transition: height 0.5s; z-index: 1; border-radius: 4px 4px 0 0; }
        .leaf { position: absolute; font-size: 20px; }
        .light-beam { position: absolute; top: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 0, rgba(255,235,59,0.3), transparent 70%); pointer-events: none; opacity: 0; transition: opacity 0.5s; }

        /* Controls */
        h2 { margin-top: 0; color: #558b2f; }
        .control-group { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        select, input { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }

        .tab-btn { padding: 10px 20px; cursor: pointer; background: #e0e0e0; border: none; border-radius: 4px 4px 0 0; margin-right: 5px; }
        .tab-btn.active { background: #fff; border: 1px solid #ccc; border-bottom: none; font-weight: bold; }

        .pot-label { font-weight: bold; margin-bottom: 5px; display: inline-block; padding: 2px 8px; border-radius: 4px; color: white; }
        .pot-a { background-color: #ef5350; }
        .pot-b { background-color: #42a5f5; }
        .pot-c { background-color: #ab47bc; }

        /* Data Tables */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f1f8e9; }

        /* Master Controls */
        .play-controls { display: flex; gap: 10px; margin-top: 20px; }
        button.play { flex: 1; background: #66bb6a; color: white; border: none; padding: 15px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button.play:hover { background: #43a047; }
        button.reset { background: #ef5350; color: white; border: none; padding: 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🌱 Growing Plants Investigation</h1>

    <div class="main-grid">
        <!-- Visual Area -->
        <div class="visual-area" id="visual-area">
            <!-- Pot A -->
            <div class="pot-container" id="pot-A">
                <div class="light-beam" id="light-A"></div>
                <div style="position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-weight: bold;">Pot A</div>
                <div class="plant-stem" id="stem-A" style="height: 0px;"></div>
                <div class="soil-surface"></div>
                <div class="pot"></div>
                <div class="stats-overlay" id="stats-A" style="font-size: 12px; margin-top: 5px;">0.0 cm | 0.0 g</div>
            </div>

            <!-- Pot B -->
            <div class="pot-container" id="pot-B">
                <div class="light-beam" id="light-B"></div>
                <div style="position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-weight: bold;">Pot B</div>
                <div class="plant-stem" id="stem-B" style="height: 0px;"></div>
                <div class="soil-surface"></div>
                <div class="pot"></div>
                <div class="stats-overlay" id="stats-B" style="font-size: 12px; margin-top: 5px;">0.0 cm | 0.0 g</div>
            </div>

            <!-- Pot C -->
            <div class="pot-container" id="pot-C">
                <div class="light-beam" id="light-C"></div>
                <div style="position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-weight: bold;">Pot C</div>
                <div class="plant-stem" id="stem-C" style="height: 0px;"></div>
                <div class="soil-surface"></div>
                <div class="pot"></div>
                <div class="stats-overlay" id="stats-C" style="font-size: 12px; margin-top: 5px;">0.0 cm | 0.0 g</div>
            </div>
        </div>

        <!-- Controls Area -->
        <div class="controls-area">
            <h2>Configuration</h2>
            <div style="margin-bottom: 15px;">
                <button class="tab-btn active" onclick="switchTab('A')">Pot A</button>
                <button class="tab-btn" onclick="switchTab('B')">Pot B</button>
                <button class="tab-btn" onclick="switchTab('C')">Pot C</button>
            </div>

            <div id="config-panel">
                <div class="control-group">
                    <label>Seed Type</label>
                    <select id="cfg-seed">
                        <option value="Tomato">Tomato</option>
                        <option value="Bean">Bean</option>
                        <option value="Turnip">Turnip</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Light Amount (Daily)</label>
                    <input type="range" id="cfg-light" min="0" max="100" value="50">
                    <div style="text-align: right; font-size: 12px;" id="disp-light">50%</div>
                </div>

                <div class="control-group">
                    <label>Water Amount (Daily mL)</label>
                    <input type="range" id="cfg-water" min="0" max="100" value="50">
                    <div style="text-align: right; font-size: 12px;" id="disp-water">50 mL</div>
                </div>

                <div class="control-group">
                    <label>Soil Type</label>
                    <select id="cfg-soil">
                        <option value="Compost">Compost (Rich)</option>
                        <option value="Fertilizer">Fertilizer (High N)</option>
                        <option value="Sand">Sand (Poor)</option>
                    </select>
                </div>
            </div>

            <div class="play-controls">
                <button class="play" onclick="sim.play()" id="btn-play">▶ Play (Day 1)</button>
                <button class="reset" onclick="sim.reset()">↺ Reset</button>
            </div>
        </div>
    </div>

    <!-- Data Area -->
    <div class="data-area">
        <h2>Data Collection</h2>
        <div style="height: 200px; overflow-y: auto;">
            <table id="data-table">
                <thead>
                    <tr>
                        <th>Day</th>
                        <th class="pot-label pot-a">Pot A Height</th>
                        <th class="pot-label pot-a">Pot A Mass</th>
                        <th class="pot-label pot-b">Pot B Height</th>
                        <th class="pot-label pot-b">Pot B Mass</th>
                        <th class="pot-label pot-c">Pot C Height</th>
                        <th class="pot-label pot-c">Pot C Mass</th>
                    </tr>
                </thead>
                <tbody id="data-body">
                    <!-- Rows go here -->
                </tbody>
            </table>
        </div>
    </div>

<script>
/* === DATA DEFINITIONS === */
const SEEDS = {
    "Tomato": { rate: 1.0, maxH: 50, color: "#4caf50" },
    "Bean": { rate: 1.5, maxH: 40, color: "#81c784" },
    "Turnip": { rate: 0.8, maxH: 20, color: "#2e7d32" }
};

const SOILS = {
    "Compost": { growth: 1.2, retention: 0.6 },
    "Fertilizer": { growth: 1.5, retention: 0.5 },
    "Sand": { growth: 0.8, retention: 0.2 }
};

/* === CLASSES === */
class Pot {
    constructor(id) {
        this.id = id;
        this.seed = "Tomato";
        this.light = 50; // 0-100
        this.water = 50; // mL
        this.soil = "Compost";

        this.height = 0;
        this.mass = 0;
        this.health = 100; // 0-100
        this.soilMoisture = 0; // %
    }

    reset() {
        this.height = 0;
        this.mass = 0;
        this.health = 100;
        this.soilMoisture = 0;
    }

    grow() {
        if (this.health <= 0) return;

        const species = SEEDS[this.seed];
        const soilProps = SOILS[this.soil];

        // 1. Water Logic
        // Add water, subtract evap
        const evap = 10 + (this.light * 0.2);
        this.soilMoisture += (this.water * soilProps.retention) - evap;
        if (this.soilMoisture < 0) this.soilMoisture = 0;
        if (this.soilMoisture > 100) this.soilMoisture = 100; // Cap

        // 2. Stress Logic
        let stress = 0;
        if (this.soilMoisture < 10) stress += 5; // Drought
        if (this.soilMoisture > 90) stress += 5; // Drowning

        // Light Stress (Too low = slow, Too high = burn?)
        if (this.light < 10) stress += 2;

        this.health -= stress;
        if (this.health < 0) this.health = 0;

        // 3. Growth Logic
        if (this.health > 20) {
            const lightFactor = this.light / 50; // Normalized around 50
            const waterFactor = Math.max(0, Math.min(1, this.soilMoisture / 50));

            const growthAmt = species.rate * soilProps.growth * lightFactor * waterFactor * (this.health/100);

            this.height += growthAmt;
            this.mass += (growthAmt * 0.2);
        }
    }
}

class Simulation {
    constructor() {
        this.pots = {
            'A': new Pot('A'),
            'B': new Pot('B'),
            'C': new Pot('C')
        };
        this.day = 0;
        this.activeTab = 'A';
        this.interval = null;

        this.bindInputs();
        this.updateUI(); // Initial
    }

    bindInputs() {
        // Bind UI inputs to active pot
        document.getElementById('cfg-seed').addEventListener('change', (e) => {
            this.pots[this.activeTab].seed = e.target.value;
            if(this.day === 0) this.updateVisuals(); // Update seed look if needed?
        });
        document.getElementById('cfg-light').addEventListener('input', (e) => {
            this.pots[this.activeTab].light = parseInt(e.target.value);
            document.getElementById('disp-light').textContent = e.target.value + "%";
            this.updateVisuals();
        });
        document.getElementById('cfg-water').addEventListener('input', (e) => {
            this.pots[this.activeTab].water = parseInt(e.target.value);
            document.getElementById('disp-water').textContent = e.target.value + " mL";
        });
        document.getElementById('cfg-soil').addEventListener('change', (e) => {
            this.pots[this.activeTab].soil = e.target.value;
        });
    }

    setActiveTab(id) {
        this.activeTab = id;

        // Update Buttons
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        // Find button with onclick matching
        const buttons = document.getElementsByClassName('tab-btn');
        for(let b of buttons) {
            if(b.textContent.includes(id)) b.classList.add('active');
        }

        // Update Inputs to match Pot state
        const p = this.pots[id];
        document.getElementById('cfg-seed').value = p.seed;
        document.getElementById('cfg-light').value = p.light;
        document.getElementById('disp-light').textContent = p.light + "%";
        document.getElementById('cfg-water').value = p.water;
        document.getElementById('disp-water').textContent = p.water + " mL";
        document.getElementById('cfg-soil').value = p.soil;
    }

    play() {
        if (this.interval) {
            // Pause
            clearInterval(this.interval);
            this.interval = null;
            document.getElementById('btn-play').textContent = "▶ Play";
            return;
        }

        document.getElementById('btn-play').textContent = "⏸ Pause";
        this.interval = setInterval(() => {
            this.day++;
            if (this.day > 50) {
                this.play(); // Auto pause at 50
                return;
            }

            // Grow all pots
            Object.values(this.pots).forEach(p => p.grow());

            this.logData();
            this.updateVisuals();
            document.getElementById('btn-play').textContent = `⏸ Day ${this.day}`;

        }, 200); // 200ms per day
    }

    reset() {
        if (this.interval) this.play(); // Stop if running
        this.day = 0;
        Object.values(this.pots).forEach(p => p.reset());
        document.getElementById('data-body').innerHTML = "";
        this.updateVisuals();
        document.getElementById('btn-play').textContent = "▶ Play (Day 1)";
    }

    logData() {
        const row = document.createElement('tr');
        row.innerHTML = `<td>${this.day}</td>
            <td>${this.pots['A'].height.toFixed(1)}</td>
            <td>${this.pots['A'].mass.toFixed(1)}</td>
            <td>${this.pots['B'].height.toFixed(1)}</td>
            <td>${this.pots['B'].mass.toFixed(1)}</td>
            <td>${this.pots['C'].height.toFixed(1)}</td>
            <td>${this.pots['C'].mass.toFixed(1)}</td>`;
        document.getElementById('data-body').prepend(row); // Newest top
    }

    updateVisuals() {
        ['A', 'B', 'C'].forEach(id => {
            const p = this.pots[id];

            // Stem Height (Scale: 1cm = 3px)
            const stem = document.getElementById(`stem-${id}`);
            stem.style.height = (p.height * 3) + "px";

            // Leaves?
            stem.innerHTML = "";
            if (p.height > 5) {
                // Add simplified leaves
                const l = document.createElement('div');
                l.className = 'leaf';
                l.textContent = "🍃";
                l.style.top = "-10px";
                l.style.left = "-10px";
                stem.appendChild(l);
            }
            if (p.height > 15) {
                 const l2 = document.createElement('div');
                l2.className = 'leaf';
                l2.textContent = "🍃";
                l2.style.top = "10px";
                l2.style.right = "-20px";
                stem.appendChild(l2);
            }

            // Light Beam Opacity
            const beam = document.getElementById(`light-${id}`);
            beam.style.opacity = p.light / 100;

            // Health Color
            if (p.health < 50) stem.style.backgroundColor = "#dcedc8"; // Yellowing
            if (p.health <= 0) stem.style.backgroundColor = "#8d6e63"; // Dead
            else stem.style.backgroundColor = "#4caf50";

            // Stats
            document.getElementById(`stats-${id}`).textContent = `${p.height.toFixed(1)} cm | ${p.mass.toFixed(1)} g`;
        });
    }

    updateUI() {
        this.setActiveTab(this.activeTab);
        this.updateVisuals();
    }
}

let sim;
function switchTab(id) {
    if (sim) sim.setActiveTab(id);
}

window.onload = () => {
    sim = new Simulation();
};

</script>
</body>
</html>
