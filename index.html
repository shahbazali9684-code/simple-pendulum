<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growing Plants Gizmo Clone</title>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; color: #333; height: 100vh; display: flex; flex-direction: column; }

        /* Toolbar */
        .toolbar { background: #e0e0e0; padding: 10px; border-bottom: 1px solid #ccc; display: flex; align-items: center; gap: 10px; }
        .toolbar h1 { margin: 0; font-size: 18px; margin-right: 20px; color: #2c3e50; }
        button.tool-btn { padding: 5px 15px; border: 1px solid #999; background: #fff; cursor: pointer; border-radius: 3px; font-weight: bold; }
        button.tool-btn:hover { background: #f0f0f0; }

        /* Main Layout */
        .workspace { display: flex; flex: 1; overflow: hidden; }

        /* Left Controls */
        .controls-panel { width: 250px; background: #fff; border-right: 1px solid #ccc; padding: 15px; overflow-y: auto; }
        .control-group { margin-bottom: 20px; background: #f9f9f9; padding: 10px; border: 1px solid #e0e0e0; border-radius: 4px; }
        .control-group h3 { margin: 0 0 10px 0; font-size: 14px; color: #555; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; font-weight: bold; }
        select, input[type="range"] { width: 100%; box-sizing: border-box; }
        .value-display { text-align: right; font-size: 11px; color: #666; margin-bottom: 8px; }

        /* Center Visuals */
        .visual-panel { flex: 1; background: #fff; display: flex; flex-direction: column; position: relative; }
        .pots-container { flex: 1; display: flex; justify-content: space-around; align-items: flex-end; padding-bottom: 20px; background: linear-gradient(to bottom, #e3f2fd 80%, #d7ccc8 80%); position: relative; }

        .pot-wrapper { position: relative; width: 100px; height: 350px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
        .pot-label { position: absolute; top: -25px; font-weight: bold; padding: 2px 8px; border-radius: 3px; color: white; font-size: 12px; }
        .pot-a-label { background: #e53935; }
        .pot-b-label { background: #1e88e5; }
        .pot-c-label { background: #8e24aa; }

        .ruler { position: absolute; left: -30px; bottom: 80px; height: 250px; width: 30px; border-right: 1px solid #333; display: flex; flex-direction: column-reverse; font-size: 10px; color: #666; }
        .tick { height: 25px; border-top: 1px solid #999; box-sizing: border-box; width: 10px; align-self: flex-end; }
        .tick-label { position: absolute; right: 12px; transform: translateY(50%); }

        .pot-base { width: 80px; height: 70px; background: #795548; clip-path: polygon(10% 0, 90% 0, 80% 100%, 20% 100%); z-index: 5; position: relative; }
        .plant-stem { width: 6px; background: #4caf50; position: absolute; bottom: 70px; z-index: 4; transition: height 0.2s; border-radius: 3px 3px 0 0; }
        .leaf { position: absolute; font-size: 20px; z-index: 6; }

        /* Lamps */
        .lamp { position: absolute; top: 20px; width: 60px; height: 40px; background: #444; border-radius: 20px 20px 0 0; z-index: 10; }
        .light-beam { position: absolute; top: 40px; width: 120px; height: 300px; background: radial-gradient(ellipse at top, rgba(255,235,59,0.4), transparent 70%); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0% 100%); pointer-events: none; opacity: 0.5; }

        /* Bottom Data Panel */
        .data-panel { height: 200px; background: #fff; border-top: 2px solid #ccc; display: flex; flex-direction: column; }
        .tabs { display: flex; background: #eee; border-bottom: 1px solid #ccc; }
        .tab { padding: 8px 20px; cursor: pointer; font-size: 13px; font-weight: bold; border-right: 1px solid #ccc; background: #eee; }
        .tab.active { background: #fff; border-bottom: 2px solid #fff; margin-bottom: -1px; }

        .tab-content { flex: 1; overflow: auto; padding: 10px; display: none; }
        .tab-content.active { display: block; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 4px 8px; text-align: center; }
        th { background: #f0f0f0; position: sticky; top: 0; }

        /* Canvas */
        #graph-canvas { width: 100%; height: 100%; }

    </style>
</head>
<body>

    <div class="toolbar">
        <h1>🌱 Growing Plants</h1>
        <button class="tool-btn" onclick="sim.play()" id="btn-play">▶ Play</button>
        <button class="tool-btn" onclick="sim.reset()">↺ Reset</button>
        <div style="flex:1"></div>
        <div id="day-counter" style="font-weight: bold; margin-right: 20px;">Day: 0</div>
    </div>

    <div class="workspace">
        <div class="controls-panel">
            <div class="control-group">
                <h3>Pot Selection</h3>
                <select id="active-pot" onchange="sim.updateControls()">
                    <option value="A">Pot A (Red)</option>
                    <option value="B">Pot B (Blue)</option>
                    <option value="C">Pot C (Purple)</option>
                </select>
            </div>

            <div class="control-group">
                <h3>Variables</h3>
                <label>Seed Type</label>
                <select id="cfg-seed">
                    <option value="Tomato">Tomato</option>
                    <option value="Bean">Bean</option>
                    <option value="Turnip">Turnip</option>
                </select>

                <label style="margin-top: 10px;">Water (mL/day)</label>
                <input type="range" id="cfg-water" min="0" max="100" value="50">
                <div class="value-display" id="disp-water">50 mL</div>

                <label>Light (%/day)</label>
                <input type="range" id="cfg-light" min="0" max="100" value="50">
                <div class="value-display" id="disp-light">50%</div>

                <label>Soil Type</label>
                <select id="cfg-soil">
                    <option value="Compost">Compost</option>
                    <option value="Fertilizer">Fertilizer</option>
                    <option value="Sand">Sand</option>
                </select>
            </div>
        </div>

        <div class="visual-panel">
            <div class="pots-container">
                <!-- Pot A -->
                <div class="pot-wrapper">
                    <div class="lamp"><div class="light-beam" id="beam-A"></div></div>
                    <div class="pot-label pot-a-label">Pot A</div>
                    <div class="ruler" id="ruler-A"></div> <!-- Rulers generated via JS -->
                    <div class="plant-stem" id="stem-A" style="height: 0px;"></div>
                    <div class="pot-base"></div>
                </div>

                <!-- Pot B -->
                <div class="pot-wrapper">
                    <div class="lamp"><div class="light-beam" id="beam-B"></div></div>
                    <div class="pot-label pot-b-label">Pot B</div>
                    <div class="ruler" id="ruler-B"></div>
                    <div class="plant-stem" id="stem-B" style="height: 0px;"></div>
                    <div class="pot-base"></div>
                </div>

                <!-- Pot C -->
                <div class="pot-wrapper">
                    <div class="lamp"><div class="light-beam" id="beam-C"></div></div>
                    <div class="pot-label pot-c-label">Pot C</div>
                    <div class="ruler" id="ruler-C"></div>
                    <div class="plant-stem" id="stem-C" style="height: 0px;"></div>
                    <div class="pot-base"></div>
                </div>
            </div>

            <div class="data-panel">
                <div class="tabs">
                    <div class="tab active" onclick="showTab('graph')">GRAPH</div>
                    <div class="tab" onclick="showTab('table')">TABLE</div>
                </div>

                <div id="tab-graph" class="tab-content active" style="overflow: hidden;">
                    <canvas id="graph-canvas"></canvas>
                </div>

                <div id="tab-table" class="tab-content">
                    <table id="data-table">
                        <thead>
                            <tr>
                                <th>Day</th>
                                <th>A Height</th> <th>A Mass</th>
                                <th>B Height</th> <th>B Mass</th>
                                <th>C Height</th> <th>C Mass</th>
                            </tr>
                        </thead>
                        <tbody id="data-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

<script>
// --- CONFIG ---
const SEEDS = {
    "Tomato": { rate: 1.0, maxH: 60, leaf: "🍃" },
    "Bean": { rate: 1.8, maxH: 50, leaf: "🌱" },
    "Turnip": { rate: 0.7, maxH: 25, leaf: "🌿" }
};
const SOILS = {
    "Compost": { growth: 1.1, hold: 0.6 },
    "Fertilizer": { growth: 1.3, hold: 0.5 },
    "Sand": { growth: 0.8, hold: 0.2 }
};

// --- SIMULATION ---
class Simulation {
    constructor() {
        this.pots = {
            'A': { seed:'Tomato', water:50, light:50, soil:'Compost', h:0, m:0, health:100, moist:0, hist:[] },
            'B': { seed:'Bean', water:50, light:50, soil:'Compost', h:0, m:0, health:100, moist:0, hist:[] },
            'C': { seed:'Turnip', water:50, light:50, soil:'Compost', h:0, m:0, health:100, moist:0, hist:[] }
        };
        this.day = 0;
        this.timer = null;

        // Init Rulers
        ['A','B','C'].forEach(id => {
            const r = document.getElementById(`ruler-${id}`);
            for(let i=0; i<=50; i+=10) {
                const t = document.createElement('div');
                t.className='tick';
                t.innerHTML = `<span class="tick-label">${i}</span>`;
                r.appendChild(t);
            }
        });

        this.bindInputs();
        this.updateControls(); // Sync UI
        this.updateVisuals();
        this.drawGraph();
    }

    bindInputs() {
        const getPot = () => this.pots[document.getElementById('active-pot').value];

        document.getElementById('cfg-seed').onchange = (e) => {
            if(this.day > 0) return; // Locked when running
            getPot().seed = e.target.value;
        };

        document.getElementById('cfg-water').oninput = (e) => {
            getPot().water = parseInt(e.target.value);
            document.getElementById('disp-water').textContent = e.target.value + " mL";
        };

        document.getElementById('cfg-light').oninput = (e) => {
            getPot().light = parseInt(e.target.value);
            document.getElementById('disp-light').textContent = e.target.value + "%";
            this.updateVisuals();
        };

        document.getElementById('cfg-soil').onchange = (e) => {
            if(this.day > 0) return;
            getPot().soil = e.target.value;
        };
    }

    updateControls() {
        const p = this.pots[document.getElementById('active-pot').value];
        document.getElementById('cfg-seed').value = p.seed;
        document.getElementById('cfg-water').value = p.water;
        document.getElementById('disp-water').textContent = p.water + " mL";
        document.getElementById('cfg-light').value = p.light;
        document.getElementById('disp-light').textContent = p.light + "%";
        document.getElementById('cfg-soil').value = p.soil;

        // Disable seeds/soil if running
        document.getElementById('cfg-seed').disabled = (this.day > 0);
        document.getElementById('cfg-soil').disabled = (this.day > 0);
    }

    play() {
        if(this.timer) {
            clearInterval(this.timer);
            this.timer = null;
            document.getElementById('btn-play').textContent = "▶ Play";
        } else {
            document.getElementById('btn-play').textContent = "⏸ Pause";
            document.getElementById('cfg-seed').disabled = true;
            document.getElementById('cfg-soil').disabled = true;

            this.timer = setInterval(() => {
                this.day++;
                if(this.day > 50) return this.play(); // Auto-stop

                this.step();
                this.updateVisuals();
                this.logData();
                this.drawGraph();
                document.getElementById('day-counter').textContent = "Day: " + this.day;
            }, 200);
        }
    }

    step() {
        Object.values(this.pots).forEach(p => {
            if(p.health <= 0) return;

            const seed = SEEDS[p.seed];
            const soil = SOILS[p.soil];

            // Moisture logic
            const evap = 5 + (p.light * 0.15);
            p.moist += (p.water * soil.hold) - evap;
            p.moist = Math.max(0, Math.min(100, p.moist));

            // Stress
            let stress = 0;
            if(p.moist < 10 || p.moist > 90) stress += 5;
            if(p.light < 10) stress += 2;
            p.health = Math.max(0, p.health - stress);

            // Growth
            if(p.health > 20) {
                const rate = seed.rate * soil.growth * (p.light/50) * (p.health/100);
                // Logistic curve approx: slow start, fast mid, slow end
                const capFactor = 1 - (p.h / seed.maxH);
                const growth = Math.max(0, rate * capFactor);

                p.h += growth;
                p.m += (growth * 0.5) + (p.h * 0.05); // Mass accumulates
            }

            p.hist.push({ h: p.h, m: p.m });
        });
    }

    reset() {
        if(this.timer) this.play(); // Pause
        this.day = 0;
        Object.values(this.pots).forEach(p => {
            p.h = 0; p.m = 0; p.health = 100; p.moist = 0; p.hist = [];
        });
        document.getElementById('data-body').innerHTML = "";
        document.getElementById('day-counter').textContent = "Day: 0";
        this.updateControls();
        this.updateVisuals();
        this.drawGraph();
    }

    updateVisuals() {
        ['A','B','C'].forEach(id => {
            const p = this.pots[id];

            // Light
            document.getElementById(`beam-${id}`).style.opacity = p.light / 100;

            // Plant
            const stem = document.getElementById(`stem-${id}`);
            // Scale: 50cm = 250px -> 1cm = 5px
            stem.style.height = (p.h * 5) + "px";

            // Leaves (Simplified visual)
            stem.innerHTML = "";
            const leafCount = Math.floor(p.h / 10);
            const icon = SEEDS[p.seed].leaf;

            for(let i=0; i<leafCount; i++) {
                const l = document.createElement('div');
                l.className = 'leaf';
                l.textContent = icon;
                l.style.bottom = (i * 30) + "px";
                l.style.left = (i % 2 === 0) ? "-15px" : "5px";
                stem.appendChild(l);
            }

            // Color based on health
            if(p.health < 50) stem.style.background = "#cddc39";
            if(p.health <= 0) stem.style.background = "#795548";
            else stem.style.background = "#4caf50";
        });
    }

    logData() {
        const r = `<tr>
            <td>${this.day}</td>
            <td>${this.pots.A.h.toFixed(1)}</td><td>${this.pots.A.m.toFixed(1)}</td>
            <td>${this.pots.B.h.toFixed(1)}</td><td>${this.pots.B.m.toFixed(1)}</td>
            <td>${this.pots.C.h.toFixed(1)}</td><td>${this.pots.C.m.toFixed(1)}</td>
        </tr>`;
        document.getElementById('data-body').insertAdjacentHTML('afterbegin', r);
    }

    drawGraph() {
        const cvs = document.getElementById('graph-canvas');
        const ctx = cvs.getContext('2d');
        const w = cvs.parentElement.clientWidth;
        const h = cvs.parentElement.clientHeight;
        cvs.width = w; cvs.height = h;

        ctx.clearRect(0,0,w,h);

        // Grid
        ctx.strokeStyle = "#eee";
        ctx.beginPath();
        for(let i=0; i<w; i+=w/10) { ctx.moveTo(i,0); ctx.lineTo(i,h); }
        for(let i=0; i<h; i+=h/5) { ctx.moveTo(0,i); ctx.lineTo(w,i); }
        ctx.stroke();

        // Plot
        const colors = { 'A':'#e53935', 'B':'#1e88e5', 'C':'#8e24aa' };

        ['A','B','C'].forEach(id => {
            const hist = this.pots[id].hist;
            if(hist.length < 2) return;

            ctx.strokeStyle = colors[id];
            ctx.lineWidth = 2;
            ctx.beginPath();

            hist.forEach((pt, i) => {
                const x = (i / 50) * w; // 50 days max
                const y = h - (pt.h / 60) * h; // 60cm max
                if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            });
            ctx.stroke();
        });
    }
}

// --- TABS ---
function showTab(t) {
    document.querySelectorAll('.tab').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));

    // Find clicked tab
    const tabs = document.querySelectorAll('.tab');
    if(t === 'graph') { tabs[0].classList.add('active'); document.getElementById('tab-graph').classList.add('active'); }
    else { tabs[1].classList.add('active'); document.getElementById('tab-table').classList.add('active'); }
}

const sim = new Simulation();
</script>
</body>
</html>
